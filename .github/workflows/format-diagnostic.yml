name: Format Diagnostic

on:
  push:
    branches:
      - agent/ux-002-holiday-work-pay-validation

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate formatted patch
        run: |
          npx prettier --write \
            src/features/holiday-work-pay/components/calculator.tsx \
            src/features/holiday-work-pay/components/calculator.test.tsx
          git diff -- \
            src/features/holiday-work-pay/components/calculator.tsx \
            src/features/holiday-work-pay/components/calculator.test.tsx > formatted.patch
      - uses: actions/upload-artifact@v4
        with:
          name: holiday-work-format-patch
          path: formatted.patch
