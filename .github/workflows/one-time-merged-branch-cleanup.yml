name: One-time merged branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-merged-branch-cleanup.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete only provably completed branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

          declare -A merged_pairs=()
          while IFS=$'\t' read -r ref sha; do
            [[ -n "$ref" && -n "$sha" ]] || continue
            merged_pairs["$ref|$sha"]=1
          done < <(
            gh api --paginate "/repos/${GITHUB_REPOSITORY}/pulls?state=closed&per_page=100"               --jq '.[] | select(.merged_at != null) | [.head.ref, .head.sha] | @tsv'
          )

          deleted=0
          deleted_by_ancestor=0
          deleted_by_merged_pr=0
          kept=0

          mapfile -t branches < <(
            git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin |
              grep -v '^HEAD$' |
              grep -v '^main$'
          )

          echo "Found ${#branches[@]} non-main branches."

          for branch in "${branches[@]}"; do
            current_sha="$(git rev-parse "refs/remotes/origin/$branch")"

            if git merge-base --is-ancestor "refs/remotes/origin/$branch" "refs/remotes/origin/main"; then
              echo "DELETE (contained in main): $branch"
              git push origin --delete "$branch"
              deleted=$((deleted + 1))
              deleted_by_ancestor=$((deleted_by_ancestor + 1))
            elif [[ -n "${merged_pairs["$branch|$current_sha"]+x}" ]]; then
              echo "DELETE (exact HEAD was merged by PR): $branch"
              git push origin --delete "$branch"
              deleted=$((deleted + 1))
              deleted_by_merged_pr=$((deleted_by_merged_pr + 1))
            else
              echo "KEEP (no proof current HEAD is merged): $branch"
              kept=$((kept + 1))
            fi
          done

          echo "Deleted total: $deleted"
          echo "Deleted because contained in main: $deleted_by_ancestor"
          echo "Deleted because exact current HEAD matches a merged PR: $deleted_by_merged_pr"
          echo "Kept: $kept"

          {
            echo "## Branch cleanup result"
            echo "- Deleted total: **$deleted**"
            echo "- Contained in main: **$deleted_by_ancestor**"
            echo "- Exact current HEAD matched a merged PR: **$deleted_by_merged_pr**"
            echo "- Preserved (not proven merged): **$kept**"
          } >> "$GITHUB_STEP_SUMMARY"
