name: Format acquisition tax debug

on:
  push:
    branches:
      - agent/ux-004-real-estate-acquisition-tax-validation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ux-004-real-estate-acquisition-tax-validation
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/features/real-estate-acquisition-tax/components/acquisition-tax-calculator.test.tsx
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/real-estate-acquisition-tax/components/acquisition-tax-calculator.test.tsx
          git commit -m "style: apply acquisition tax test formatting"
          git push
