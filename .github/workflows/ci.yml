name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format UX-003 files for diagnosis
        run: >-
          npx prettier --write
          src/features/loan-affordability/components/loan-affordability-calculator.tsx
          src/features/loan-affordability/components/loan-affordability-calculator.test.tsx

      - name: Upload formatted UX-003 files
        uses: actions/upload-artifact@v4
        with:
          name: formatted-loan-affordability
          path: src/features/loan-affordability/components/

      - name: Run static checks
        run: npm run check

      - name: Build application
        run: npm run build
