name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Capture check output
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee check-output.txt
      - name: Upload check output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-001-exact-check-output
          path: check-output.txt
