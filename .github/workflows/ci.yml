name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  format-task-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run format
      - uses: actions/upload-artifact@v4
        with:
          name: ux-001-formatted-task-queue
          path: TASK_QUEUE.md
