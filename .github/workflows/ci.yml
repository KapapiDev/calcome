name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate formatted directory config
        run: npx prettier src/config/calculator-directory.ts > formatted-calculator-directory.ts

      - name: Upload formatted directory config
        uses: actions/upload-artifact@v4
        with:
          name: formatted-calculator-directory
          path: formatted-calculator-directory.ts

      - name: Require formatting fix
        run: npx prettier --check src/config/calculator-directory.ts