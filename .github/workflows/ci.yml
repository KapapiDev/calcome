name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Show gross-up formatting diff
        run: npx prettier src/features/gross-up-salary/components/gross-up-salary-calculator.tsx | diff -u src/features/gross-up-salary/components/gross-up-salary-calculator.tsx - || true

      - name: Run static checks
        run: npm run check

      - name: Build application
        run: npm run build
