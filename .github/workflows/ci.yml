name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture formatter output
        run: |
          npx prettier --write \
            src/features/holiday-work-pay/components/calculator.tsx \
            src/features/holiday-work-pay/components/calculator.test.tsx
          git diff -- \
            src/features/holiday-work-pay/components/calculator.tsx \
            src/features/holiday-work-pay/components/calculator.test.tsx > formatted.patch
          git checkout -- \
            src/features/holiday-work-pay/components/calculator.tsx \
            src/features/holiday-work-pay/components/calculator.test.tsx

      - name: Upload formatter output
        uses: actions/upload-artifact@v4
        with:
          name: holiday-work-format-patch
          path: formatted.patch

      - name: Run static checks
        run: npm run check

      - name: Build application
        run: npm run build
