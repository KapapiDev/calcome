name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Report full dependency audit
        continue-on-error: true
        run: npm audit --json

      - name: Enforce production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Check formatting
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npm run format:check > /tmp/format-check.log 2>&1
          status=$?
          set -e
          cat /tmp/format-check.log

          if [ "$status" -ne 0 ] && [ "${{ github.event_name }}" = "pull_request" ]; then
            {
              echo '<!-- calcome-format-check -->'
              echo '### Formatting corrective diff'
              echo
              echo '```text'
              cat /tmp/format-check.log
              echo '```'
            } > /tmp/format-comment.md
            gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/format-comment.md
          fi

          exit "$status"

      - name: Run tests
        run: npm run test

      - name: Build application
        run: npm run build
