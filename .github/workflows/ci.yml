name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format automation document
        run: npx prettier --write AUTOMATION.md

      - name: Upload formatted automation document
        uses: actions/upload-artifact@v4
        with:
          name: formatted-automation-document
          path: AUTOMATION.md
