name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Report full dependency audit
        continue-on-error: true
        run: npm audit --json

      - name: Enforce production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Check formatting
        id: formatting
        continue-on-error: true
        run: npm run format:check

      - name: Commit formatter corrections
        if: steps.formatting.outcome == 'failure' && github.event_name == 'pull_request'
        run: |
          if git diff --quiet; then
            echo "Formatter failed without producing a working-tree diff."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Apply Prettier formatting"
          git push origin "HEAD:${{ github.head_ref }}"

      - name: Enforce formatting result
        if: steps.formatting.outcome == 'failure'
        run: exit 1

      - name: Run tests
        run: npm run test

      - name: Build application
        run: npm run build
