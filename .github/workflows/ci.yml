name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check selector formatting
        run: npx prettier --check src/components/layout/language-selector.tsx

      - name: Check routing formatting
        run: npx prettier --check src/components/layout/language-routing.ts

      - name: Check test formatting
        run: npx prettier --check src/components/layout/language-selector.test.tsx

      - name: Check workflow formatting
        run: npx prettier --check .github/workflows/ci.yml
