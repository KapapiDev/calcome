name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format test file
        run: npx prettier --write src/components/layout/language-selector.test.tsx

      - name: Upload formatted test
        uses: actions/upload-artifact@v4
        with:
          name: formatted-language-selector-test
          path: src/components/layout/language-selector.test.tsx
