name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  format-and-commit:
    if: github.event.pull_request.head.ref == 'agent/ux-001-categorized-directory'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run format
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TASK_QUEUE.md src/app/calculators/page.tsx src/app/calculators/page.test.tsx src/app/page.tsx src/config/calculator-directory.ts src/config/calculator-directory.test.ts
          if git diff --cached --quiet; then
            echo "No formatter changes"
          else
            git commit -m "UX-001: apply repository formatter"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
