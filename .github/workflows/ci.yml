name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  update-structured-data-expectation:
    if: github.event.pull_request.head.ref == 'agent/ux-001-categorized-directory'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Add the 51st structured-data expectation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/app/calculators/page.test.tsx')
          text = path.read_text()
          old = '''          {
            position: 50,
            name: "배당금 계산기",
            url: "https://www.calcome.com/ko/finance/dividend",
          },
        ],'''
          new = '''          {
            position: 50,
            name: "배당금 계산기",
            url: "https://www.calcome.com/ko/finance/dividend",
          },
          {
            position: 51,
            name: "배당수익률 계산기",
            url: "https://www.calcome.com/ko/finance/dividend-yield",
          },
        ],'''
          assert text.count(old) == 1
          path.write_text(text.replace(old, new))
          PY
      - name: Commit expectation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/calculators/page.test.tsx
          git commit -m "UX-001: cover dividend yield in directory JSON-LD"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
