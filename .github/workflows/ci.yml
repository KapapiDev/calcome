name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format changed files
        run: npx prettier --write src/features/debt-repayment-period/components/debt-repayment-period-calculator.tsx src/features/debt-repayment-period/components/debt-repayment-period-calculator.test.tsx

      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: debt-repayment-period-prettier
          path: |
            src/features/debt-repayment-period/components/debt-repayment-period-calculator.tsx
            src/features/debt-repayment-period/components/debt-repayment-period-calculator.test.tsx

      - name: Run static checks
        run: npm run check

      - name: Build application
        run: npm run build
