name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  update-directory-expectations:
    if: github.event.pull_request.head.ref == 'agent/ux-001-categorized-directory'
    runs-on: ubuntu-latest
    steps:
      - name: Check out task branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Update exact directory expectations
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/app/calculators/page.test.tsx')
          text = path.read_text()
          assert text.count(').toHaveLength(50);') == 1
          assert text.count('numberOfItems: 50,') == 1
          text = text.replace(').toHaveLength(50);', ').toHaveLength(51);')
          text = text.replace('numberOfItems: 50,', 'numberOfItems: 51,')
          path.write_text(text)
          PY

      - name: Commit updated expectations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/calculators/page.test.tsx
          git commit -m "UX-001: update directory count expectations"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
