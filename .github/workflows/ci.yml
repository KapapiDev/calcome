name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture static-check output
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee check-output.txt

      - name: Upload static-check output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-001-static-check-output
          path: check-output.txt

      - name: Build application
        run: npm run build
