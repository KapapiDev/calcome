name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Report full dependency audit
        continue-on-error: true
        run: npm audit --json

      - name: Enforce production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      - name: Check task state
        run: npm run task-state:check

      - name: Run tests
        id: tests
        shell: bash
        run: |
          set -o pipefail
          npm run test 2>&1 | tee vitest-output.log

      - name: Publish test failure diagnostics
        if: failure() && steps.tests.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "## Vitest failure diagnostics"
            echo '```text'
            tail -n 200 vitest-output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test failure diagnostics
        if: failure() && steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: vitest-failure-${{ github.sha }}
          path: vitest-output.log
          retention-days: 3

      - name: Build application
        run: npm run build
