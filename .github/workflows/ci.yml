name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply formatter for diagnostics
        run: npx prettier --write src/features/ltv/components/ltv-calculator.tsx src/features/ltv/components/ltv-calculator.test.tsx

      - name: Upload formatted LTV files
        uses: actions/upload-artifact@v4
        with:
          name: formatted-ltv-files
          path: |
            src/features/ltv/components/ltv-calculator.tsx
            src/features/ltv/components/ltv-calculator.test.tsx
