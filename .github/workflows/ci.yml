name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run static checks
        run: npm run check 2>&1 | tee check.log

      - name: Upload check diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-diagnostics
          path: check.log

      - name: Build application
        run: npm run build