name: UX-001 Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  format-output:
    if: github.event.pull_request.head.ref == 'agent/ux-001-categorized-directory'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Format affected files
        run: npx prettier --write src/app/calculators/page.tsx TASK_QUEUE.md
      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: ux-001-formatted-files
          path: |
            src/app/calculators/page.tsx
            TASK_QUEUE.md
