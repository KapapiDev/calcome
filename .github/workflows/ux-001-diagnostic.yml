name: UX-001 Diagnostic

on:
  pull_request:

permissions:
  contents: write

jobs:
  format-and-commit:
    if: github.event.pull_request.head.ref == 'agent/ux-001-categorized-directory'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Format affected files
        run: npx prettier --write src/app/calculators/page.tsx TASK_QUEUE.md
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/calculators/page.tsx TASK_QUEUE.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "UX-001: apply repository formatting"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
