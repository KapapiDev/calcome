name: UX-001 Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  test-output:
    if: github.event.pull_request.head.ref == 'agent/ux-001-categorized-directory'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Capture tests
        shell: bash
        run: |
          set -o pipefail
          npm run test 2>&1 | tee test-output.txt
      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-001-latest-test-output
          path: test-output.txt
