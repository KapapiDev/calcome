name: Temp format comprehensive tax

on:
  push:
    branches:
      - agent/ux-004-comprehensive-real-estate-holding-tax-validation
    paths:
      - .github/workflows/temp-format-comprehensive-tax.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ux-004-comprehensive-real-estate-holding-tax-validation
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/features/comprehensive-real-estate-holding-tax/components/comprehensive-real-estate-holding-tax-calculator.tsx src/features/comprehensive-real-estate-holding-tax/components/comprehensive-real-estate-holding-tax-calculator.test.tsx
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/comprehensive-real-estate-holding-tax/components/comprehensive-real-estate-holding-tax-calculator.tsx src/features/comprehensive-real-estate-holding-tax/components/comprehensive-real-estate-holding-tax-calculator.test.tsx
          if git diff --cached --quiet; then
            echo "No formatting changes"
          else
            git commit -m "style: apply repository prettier output"
            git push origin HEAD:agent/ux-004-comprehensive-real-estate-holding-tax-validation
          fi
