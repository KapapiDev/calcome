name: Format inheritance test

on:
  push:
    branches:
      - agent/ux-004-inheritance-tax-validation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ux-004-inheritance-tax-validation
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/features/inheritance-tax/components/inheritance-tax-calculator.test.tsx
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/inheritance-tax/components/inheritance-tax-calculator.test.tsx
          git diff --cached --quiet || git commit -m "style(UX-004): apply Prettier output"
          git push
