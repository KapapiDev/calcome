name: Format property tax files

on:
  push:
    branches:
      - agent/ux-004-property-tax-validation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/ux-004-property-tax-validation
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format property tax files
        run: npx prettier --write src/features/property-tax/components/property-tax-calculator.tsx src/features/property-tax/components/property-tax-calculator.test.tsx
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/property-tax/components/property-tax-calculator.tsx src/features/property-tax/components/property-tax-calculator.test.tsx
          git commit -m "chore: apply repository formatting"
          git push origin HEAD:agent/ux-004-property-tax-validation
