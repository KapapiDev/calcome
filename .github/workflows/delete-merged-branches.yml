name: Delete merged branches

on:
  pull_request:
    types:
      - closed
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  delete-branch:
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete unchanged merged head branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          MERGED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ "$HEAD_REF" == "main" ]]; then
            echo "Refusing to delete main."
            exit 0
          fi

          current_sha="$(
            gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/${HEAD_REF}" \
              --jq '.object.sha' 2>/dev/null || true
          )"

          if [[ -z "$current_sha" ]]; then
            echo "Branch already deleted: $HEAD_REF"
            exit 0
          fi

          if [[ "$current_sha" != "$MERGED_HEAD_SHA" ]]; then
            echo "Branch changed after merge; preserving $HEAD_REF."
            echo "Merged PR head: $MERGED_HEAD_SHA"
            echo "Current branch: $current_sha"
            exit 0
          fi

          echo "Deleting merged branch: $HEAD_REF"
          gh api --method DELETE \
            "/repos/${GITHUB_REPOSITORY}/git/refs/heads/${HEAD_REF}"

  sweep-merged-branches:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Sweep unchanged heads from merged PRs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          owner="${GITHUB_REPOSITORY%%/*}"

          gh api --paginate "/repos/${GITHUB_REPOSITORY}/branches?per_page=100" \
            --jq '.[].name' |
          while IFS= read -r branch; do
            [[ "$branch" == "main" ]] && continue

            current_sha="$(
              gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" \
                --jq '.object.sha' 2>/dev/null || true
            )"
            [[ -z "$current_sha" ]] && continue

            open_count="$(
              gh api --method GET "/repos/${GITHUB_REPOSITORY}/pulls" \
                -f state='open' \
                -f head="${owner}:${branch}" \
                -f per_page='1' \
                --jq 'length'
            )"
            if [[ "$open_count" != "0" ]]; then
              echo "Preserving open-PR branch: $branch"
              continue
            fi

            exact_merged_head_count="$(
              gh api --method GET "/repos/${GITHUB_REPOSITORY}/pulls" \
                -f state='closed' \
                -f head="${owner}:${branch}" \
                -f per_page='100' \
                --jq "[.[] | select(.merged_at != null and .head.sha == \"$current_sha\")] | length"
            )"

            if [[ "$exact_merged_head_count" == "0" ]]; then
              echo "Preserving branch without exact merged-head proof: $branch"
              continue
            fi

            echo "Deleting stale merged branch: $branch"
            gh api --method DELETE \
              "/repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
          done
