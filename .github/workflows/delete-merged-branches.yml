name: Delete merged branches

on:
  pull_request:
    types:
      - closed

permissions:
  contents: write
  pull-requests: read

jobs:
  delete-branch:
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete unchanged merged head branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          MERGED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ "$HEAD_REF" == "main" ]]; then
            echo "Refusing to delete main."
            exit 0
          fi

          current_sha="$(
            gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/${HEAD_REF}"               --jq '.object.sha' 2>/dev/null || true
          )"

          if [[ -z "$current_sha" ]]; then
            echo "Branch already deleted: $HEAD_REF"
            exit 0
          fi

          if [[ "$current_sha" != "$MERGED_HEAD_SHA" ]]; then
            echo "Branch changed after merge; preserving $HEAD_REF."
            echo "Merged PR head: $MERGED_HEAD_SHA"
            echo "Current branch: $current_sha"
            exit 0
          fi

          echo "Deleting merged branch: $HEAD_REF"
          gh api --method DELETE             "/repos/${GITHUB_REPOSITORY}/git/refs/heads/${HEAD_REF}"
